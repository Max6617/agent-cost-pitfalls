schema = "https://github.com/ASSERT-KTH/assert-research-agent/blob/main/schemas/audit-v1.json"

# osaudit configuration for "Six Pitfalls in Measuring the Cost of Coding Agents" (paper/PAPER.tex).
#
# How the numbers trace. paper-numbers/extract.py copies each quantity the paper cites from a
# committed file, by the explicit JSON path listed in paper-numbers/map/*.json, and refuses a
# source whose sha256 differs from artifact/MANIFEST.json. paper-numbers/derived.py computes the
# few cited quantities no analysis output stores. paper-numbers/build.sh writes every
# paper-numbers/results/*.json through `osaudit run`, which records the command, the sha256 of
# each input and the git commit.
#
# Scope. osaudit has no rule exclusions; this file narrows the audit in two places, because the
# fix would rewrite the v1.0 artifact (doi:10.5281/zenodo.24039669):
# - analysis/*.json are inputs of the extractors, not results files. Declaring them would report
#   results/no-provenance on each, and adding a provenance block rewrites outputs checksummed in
#   artifact/MANIFEST.json.
# - tools/*.mjs are not instruments. The analysis tools stamp a `generated` time with new Date()
#   (results/wall-clock), and a fix or an inline exemption edits the v1.0 analysis code. Their
#   commands and outputs are recorded in the MANIFEST and re-checked by
#   `node tools/artifact.mjs --verify`.
#
# Allow entries. Most cover numbers the study does not produce: model-name versions, suite and
# pitfall labels, confidence levels and other protocol constants, typesetting tokens, figures
# from cited work, and provider price cards. The rest are study numbers no committed data file
# can back, and each reason says so and names where the number is recorded: the Anthropic
# development pilot (raw logs not in the artifact, as the paper states), provider-console
# readings, the reseed experiment, and rounded projections whose exact value is traced.
#
# Corrections. The last section traces the numbers the v1.0 PDF misprinted (double rounding, or
# values left from the earlier B = 5,000 bootstrap) and paper/PAPER.tex now prints correctly.

[paper]
tex = ["paper/PAPER.tex"]

[results]
files = ["paper-numbers/results/*.json"]
instruments = ["paper-numbers/extract.py", "paper-numbers/derived.py"]

